  veins: 4
  size: 6
  pickaxe: { fr: fer, en: iron }
  alloy: duralumin
  note: { fr: "Rare, autour de Y = 0.", en: "Rare, around Y = 0." }
- id: manganese
  name: { fr: Manganèse, en: Manganese }
  icons: [manganese_ore, deepslate_manganese_ore, raw_manganese, manganese_ingot]
  y: { fr: "-64 à 16", en: "-64 to 16" }
  veins: 6
  size: 6
  pickaxe: { fr: fer, en: iron }
  alloy: duralumin
  note: { fr: "Rare et profond, surtout sous Y = 0.", en: "Rare and deep, mostly below Y = 0." }
