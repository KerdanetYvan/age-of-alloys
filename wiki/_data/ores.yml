# The four metals of the world, for the ore cards. `icons`: the ore, the deepslate ore and the raw item.
- id: tin
  name: { fr: Étain, en: Tin }
  icons: [tin_ore, deepslate_tin_ore, raw_tin, tin_ingot]
  y: { fr: "-24 à 80", en: "-24 to 80" }
  veins: 16
  size: 9
  pickaxe: { fr: pierre, en: stone }
  alloy: bronze
  note: { fr: "Presque aussi fréquent que le cuivre.", en: "Almost as common as copper." }
- id: aluminum
  name: { fr: Aluminium, en: Aluminum }
  icons: [aluminum_ore, deepslate_aluminum_ore, raw_aluminum, aluminum_ingot]
  y: { fr: "0 à 128", en: "0 to 128" }
  veins: 14
  size: 9
  pickaxe: { fr: pierre, en: stone }
  alloy: duralumin
  note: { fr: "Le plus courant, de la surface aux grottes. Ses veines sombres se repèrent bien.", en: "The most common, from the surface down to the caves. Its dark veins are easy to spot." }
- id: magnesium
  name: { fr: Magnésium, en: Magnesium }
  icons: [magnesium_ore, deepslate_magnesium_ore, raw_magnesium, magnesium_ingot]
